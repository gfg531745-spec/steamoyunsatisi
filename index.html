<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<title>BakuShopAzerbaijan — V5</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;
 background:#060609;
 color:#f7f7fb;
 font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
 overflow-x:hidden
}
body:before{
 content:"";
 position:fixed;
 inset:-30%;
 z-index:-2;
 background:
 radial-gradient(circle at 20% 15%,#8b5cf633,transparent 25%),
 radial-gradient(circle at 80% 40%,#ff3cac22,transparent 24%),
 radial-gradient(circle at 50% 100%,#4f46e522,transparent 28%);
 filter:blur(35px);
 animation:bg 16s ease-in-out infinite alternate
}
@keyframes bg{
 to{transform:translate(3%,2%) scale(1.08) rotate(6deg)}
}
@keyframes rise{
 from{opacity:0;transform:translateY(24px)}
 to{opacity:1;transform:none}
}
.top{
 position:sticky;
 top:0;
 z-index:50;
 border-bottom:1px solid #ffffff12;
 background:#060609d9;
 backdrop-filter:blur(20px)
}
.nav{
 max-width:1450px;
 margin:auto;
 display:flex;
 gap:10px;
 align-items:center;
 padding:13px 20px
}
.brand{
 font-size:19px;
 font-weight:950;
 letter-spacing:-.8px;
 margin-right:auto
}
.brand span{color:#c4b5fd}
.btn,.select,.search{
 border:1px solid #ffffff16;
 background:#ffffff08;
 color:#fff;
 border-radius:12px
}
.btn{
 padding:10px 13px;
 cursor:pointer
}
.select{padding:10px}
.select option{background:#111}
.hero{
 max-width:1450px;
 margin:auto;
 padding:75px 20px 35px;
 animation:rise .7s
}
.pill{
 display:inline-flex;
 padding:8px 12px;
 border:1px solid #a78bfa44;
 background:#8b5cf612;
 border-radius:99px;
 color:#d8b4fe;
 font-size:11px;
 font-weight:800
}
h1{
 font-size:clamp(48px,7vw,96px);
 line-height:.9;
 letter-spacing:-6px;
 margin:18px 0 20px
}
.gradient{
 background:linear-gradient(100deg,#fff,#c4b5fd,#f0abfc);
 color:transparent;
 background-clip:text;
 -webkit-background-clip:text
}
.hero p{
 max-width:720px;
 color:#9b9ba7;
 line-height:1.7
}
.notice{
 max-width:1450px;
 margin:auto;
 padding:0 20px 22px
}
.notice>div{
 padding:14px 16px;
 border:1px solid #facc1533;
 background:#facc1509;
 border-radius:15px;
 color:#ddd;
 font-size:13px;
 line-height:1.6
}
.profile,.admin{
 max-width:1450px;
 margin:auto;
 padding:0 20px 20px;
 display:none
}
.panel{
 border:1px solid #ffffff13;
 background:#ffffff06;
 border-radius:18px;
 padding:15px
}
.profilegrid{
 display:flex;
 gap:14px;
 align-items:center;
 flex-wrap:wrap
}
.xp{
 height:8px;
 min-width:180px;
 flex:1;
 background:#ffffff0c;
 border-radius:99px;
 overflow:hidden
}
.xp i{
 display:block;
 height:100%;
 width:0;
 background:linear-gradient(90deg,#8b5cf6,#f0abfc);
 transition:1s
}
.shop{
 max-width:1450px;
 margin:auto;
 padding:10px 20px 90px
}
.tools{
 display:flex;
 gap:10px;
 margin-bottom:18px
}
.search{
 flex:1;
 padding:14px;
 outline:0
}
.grid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:15px
}
.card{
 background:linear-gradient(145deg,#15151b,#09090c);
 border:1px solid #ffffff12;
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 20px 60px #0008;
 animation:rise .55s both;
 transition:.3s
}
.card:hover{
 transform:translateY(-7px);
 border-color:#a78bfa66;
 box-shadow:0 30px 80px #000b,0 0 30px #8b5cf622
}
.cover{
 aspect-ratio:2/3;
 background:#111;
 overflow:hidden;
 position:relative
}
.cover img{
 width:100%;
 height:100%;
 object-fit:cover;
 transition:.6s
}
.card:hover img{transform:scale(1.07)}
.cover:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(0deg,#000d,transparent 48%)
}
.info{padding:12px}
.name{
 font-size:13px;
 font-weight:800;
 line-height:1.4;
 min-height:38px
}
.bar{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
 margin-top:12px
}
.price{
 font-weight:950;
 font-size:18px
}
.old{
 text-decoration:line-through;
 color:#777;
 font-size:11px;
 margin-left:5px;
 font-weight:600
}
.add{
 border:0;
 border-radius:10px;
 padding:9px 11px;
 background:linear-gradient(135deg,#7c3aed,#d8b4fe);
 color:#fff;
 font-weight:900;
 cursor:pointer;
 position:relative;
 overflow:hidden
}
.add:after{
 content:"";
 position:absolute;
 top:-100%;
 left:-130%;
 width:50%;
 height:300%;
 background:#fff5;
 transform:rotate(20deg);
 transition:.5s
}
.add:hover:after{left:150%}
.overlay{
 position:fixed;
 inset:0;
 z-index:100;
 background:#000b;
 backdrop-filter:blur(8px);
 opacity:0;
 pointer-events:none;
 transition:.25s
}
.overlay.open{
 opacity:1;
 pointer-events:auto
}
.drawer{
 position:absolute;
 right:0;
 top:0;
 width:min(480px,100%);
 height:100%;
 background:#0b0b0f;
 border-left:1px solid #ffffff16;
 padding:20px;
 display:flex;
 flex-direction:column;
 animation:rise .3s
}
.items{
 flex:1;
 overflow:auto
}
.item{
 display:flex;
 gap:10px;
 padding:12px 0;
 border-bottom:1px solid #ffffff10
}
.item img{
 width:52px;
 height:72px;
 object-fit:cover;
 border-radius:8px
}
.grow{flex:1}
.grow b{
 font-size:12px;
 line-height:1.4
}
.qty{
 display:flex;
 gap:6px;
 align-items:center;
 margin-top:7px
}
.qty button,.remove{
 background:#ffffff09;
 color:#fff;
 border:1px solid #ffffff14;
 border-radius:7px;
 width:25px;
 height:25px;
 cursor:pointer
}
.remove{
 border:0;
 color:#ff6684
}
.cartfoot{
 border-top:1px solid #ffffff14;
 padding-top:14px
}
.total{
 display:flex;
 justify-content:space-between;
 font-size:21px;
 font-weight:950;
 margin-bottom:12px
}
.wa{
 width:100%;
 padding:14px;
 border:0;
 border-radius:12px;
 background:#25d366;
 color:#06140b;
 font-weight:950;
 cursor:pointer
}
.modal{
 display:none;
 position:fixed;
 inset:0;
 z-index:200;
 place-items:center;
 padding:18px;
 background:#000d
}
.modal.show{display:grid}
.box{
 width:min(430px,100%);
 padding:22px;
 border-radius:20px;
 background:#0e0e13;
 border:1px solid #ffffff16;
 box-shadow:0 30px 100px #000
}
.field{
 width:100%;
 padding:12px;
 margin:6px 0;
 border-radius:10px;
 border:1px solid #ffffff14;
 background:#ffffff08;
 color:#fff;
 outline:0
}
.primary{
 width:100%;
 padding:12px;
 border:0;
 border-radius:10px;
 background:linear-gradient(135deg,#7c3aed,#d8b4fe);
 color:#fff;
 font-weight:900;
 cursor:pointer
}
.link{
 border:0;
 background:none;
 color:#c4b5fd;
 cursor:pointer;
 margin-top:9px
}
.orders{
 display:grid;
 gap:8px;
 margin-top:12px
}
.order{
 padding:12px;
 border:1px solid #ffffff12;
 border-radius:12px;
 background:#ffffff06
}
.confirm{
 margin-top:8px;
 border:0;
 border-radius:9px;
 padding:8px 11px;
 background:#25d366;
 font-weight:900;
 cursor:pointer
}
.toast{
 position:fixed;
 left:50%;
 bottom:24px;
 z-index:300;
 transform:translate(-50%,20px);
 opacity:0;
 pointer-events:none;
 background:#15151b;
 border:1px solid #ffffff18;
 padding:11px 15px;
 border-radius:12px;
 box-shadow:0 15px 50px #0008;
 transition:.25s
}
.toast.show{
 opacity:1;
 transform:translate(-50%,0)
}
footer{
 border-top:1px solid #ffffff10;
 text-align:center;
 color:#666;
 padding:25px;
 font-size:11px
}
@media(max-width:1150px){
 .grid{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:850px){
 .grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:600px){
 .nav{padding:10px}
 .brand{font-size:14px}
 .nav .btn,.select{
  padding:8px;
  font-size:11px
 }
 .hero{
  padding:55px 14px 30px
 }
 .hero h1{
  font-size:50px;
  letter-spacing:-3px
 }
 .notice,.shop,.profile,.admin{
  padding-left:9px;
  padding-right:9px
 }
 .grid{
  grid-template-columns:repeat(2,1fr);
  gap:8px
 }
 .info{padding:9px}
 .name{font-size:11px}
 .bar{display:block}
 .price{margin-bottom:8px}
 .add{width:100%}
}
</style>
</head>

function render(){

}

function add(id){

x=>x.id===id
);

?x.qty++
:cart.push({
id,
qty:1
});

updateCart();

toast("🛒 Səbətə əlavə edildi");

}

</button>

</div>

</div>

<button
class="remove"
onclick="removeItem(${g.id})"
>
×
</button>

</div>

`;

}
).join("")
:
"<div style='padding:60px;text-align:center;color:#777'>Səbət boşdur 🎮</div>";

document.getElementById(
"total"
).textContent=
n*4+" ₼";

}

function change(id,d){

let x=cart.find(
x=>x.id===id
);

if(!x)return;

x.qty+=d;

if(x.qty<1)
removeItem(id);

else{

save();

updateCart();

}

}

function removeItem(id){

cart=cart.filter(
x=>x.id!==id
);

save();

updateCart();

}

function openCart(){

document
.getElementById("cartOverlay")
.classList.add("open");

}

function closeCart(){

document
.getElementById("cartOverlay")
.classList.remove("open");

}

function order(){

if(!cart.length)
return toast("Səbət boşdur");

let text=
"🎮 BakuShopAzerbaijan SİFARİŞİ\n\n";

cart.forEach(
(x,i)=>{

let g=games.find(
g=>g.id===x.id
);

text+=
`${i+1}. ${g.name}\n`+
`${x.qty} × 4 ₼\n\n`;

}
);

let total=
cart.reduce(
(a,x)=>a+x.qty,
0
)*4;

text+="💰 Cəmi: "+total+" ₼";

if(current){

orders.push({

id:Date.now(),

email:current.email,

items:cart.map(
x=>({
id:x.id,
qty:x.qty
})
),

total,

status:"pending",

date:new Date().toLocaleString()

});

save();

}

window.open(
"https://wa.me/"+WA+
"?text="+
encodeURIComponent(text),
"_blank"
);

cart=[];

save();

updateCart();

closeCart();

toast(
"✅ Sifariş yaradıldı • səbət təmizləndi"
);

}

function openAuth(){

document
.getElementById("auth")
.classList.add("show");

syncAuth();

}

function closeAuth(){

document
.getElementById("auth")
.classList.remove("show");

}

function toggleAuth(){

mode=
mode==="signup"
?"login"
:"signup";

syncAuth();

}

function syncAuth(){

let t=I18N[lang];

document
.getElementById("authTitle")
.textContent=t.account;

document
.getElementById("authSubmit")
.textContent=
mode==="signup"
?t.signup
:t.login;

document
.getElementById("authToggle")
.textContent=
mode==="signup"
?"Artıq hesabım var"
:"Hesab yarat";

}

function authSubmit(){

let email=
document.getElementById("email")
.value
.trim()
.toLowerCase();

let pass=
document.getElementById("pass")
.value;

if(
!email||
pass.length<8
)
return toast(
"⚠️ E-poçt və ən azı 8 simvolluq şifrə lazımdır"
);

if(mode==="signup"){

if(
users.some(
u=>u.email===email
)
)
return toast(
"Bu hesab artıq var"
);

users.push({

email,

pass,

xp:0,

gifts:0,

admin:users.length===0

});

}

let u=users.find(
u=>
u.email===email&&
u.pass===pass
);

if(!u)
return toast(
"❌ E-poçt və ya şifrə yanlışdır"
);

current={
email
};

localStorage.setItem(
"bsa_current_v5",
JSON.stringify(current)
);

save();

closeAuth();

refreshUser();

toast(
"👋 Xoş gəldin!"
);

}

function logout(){

current=null;

localStorage.removeItem(
"bsa_current_v5"
);

refreshUser();

}

function levelInfo(xp){

let level=1;

let need=100;

let left=xp;

while(left>=need){

left-=need;

level++;

need=100+
(level-1)*50;

}

return{
level,
left,
need
};

}

function refreshUser(){

let p=
document.getElementById("profile");

let a=
document.getElementById("admin");

if(!current){

p.style.display="none";

a.style.display="none";

document.getElementById(
"accountBtn"
).textContent=
I18N[lang].account;

return;

}

let u=users.find(
u=>u.email===current.email
);

if(!u){

logout();

return;

}

p.style.display="block";

document.getElementById(
"userEmail"
).textContent=u.email;

let l=
levelInfo(u.xp||0);

document.getElementById(
"userLevel"
).textContent=
"LV."+l.level;

document.getElementById(
"xpText"
).textContent=
`${l.left}/${l.need} XP • 🎁 ${u.gifts||0}`;

document.getElementById(
"xpBar"
).style.width=
Math.min(
100,
l.left/l.need*100
)+"%";

document.getElementById(
"logoutBtn"
).textContent=
I18N[lang].logout;

document.getElementById(
"accountBtn"
).textContent=
"👤 "+
u.email.split("@")[0];

if(u.admin){

a.style.display="block";

renderAdmin();

}else{

a.style.display="none";

}

}

function renderAdmin(){

let pending=
orders.filter(
o=>o.status==="pending"
);

document.getElementById(
"adminStats"
).textContent=
`İstifadəçi: ${users.length} • Gözləyən sifariş: ${pending.length}`;

document.getElementById(
"adminUsers"
).innerHTML=
"<div style='margin-top:10px;font-size:12px;color:#aaa'>Admin seçimi:</div>"+
users.map(
u=>
`<button class="btn"
style="margin:7px 5px 0 0"
onclick="toggleAdmin('${encodeURIComponent(u.email)}')">
${u.admin?"🛡️ ":""}${u.email}
</button>`
).join("");

document.getElementById(
"orders"
).innerHTML=
pending.length
?
pending.map(
o=>
`<div class="order">

<b>
📦 ${o.email}
</b>

<br>

<small>
${o.date} • ${o.total} ₼
</small>

<br>

${o.items.map(
x=>{

let g=
games.find(
g=>g.id===x.id
);

return `${g.name} × ${x.qty}`;

}
).join("<br>")}

<br>

<button
class="confirm"
onclick="confirmOrder(${o.id})"
>
✓ Təsdiqlə və XP ver
</button>

</div>`
).join("")
:
"<small style='color:#777'>Gözləyən sifariş yoxdur.</small>";

}

function toggleAdmin(e){

let u=
users.find(
u=>u.email===decodeURIComponent(e)
);

if(u){

u.admin=!u.admin;

save();

refreshUser();

}

}

function confirmOrder(id){

let o=
orders.find(
o=>o.id===id
);

if(!o)return;

let u=
users.find(
u=>u.email===o.email
);

if(!u)return;

let before=
levelInfo(
u.xp||0
).level;

u.xp=
(u.xp||0)+
o.items.reduce(
(a,x)=>a+x.qty,
0
)*25;

let after=
levelInfo(
u.xp
).level;

[
3,
5,
10,
15,
20,
25
].forEach(
n=>{

if(
before<n&&
after>=n
)
u.gifts=
(u.gifts||0)+1;

}
);

o.status="confirmed";

save();

refreshUser();

toast(
"✅ Sifariş təsdiqləndi • XP verildi"
);

}

function setLang(l){

lang=l;

localStorage.setItem(
"bsa_lang_v5",
l
);

applyLang();

}

function applyLang(){

let t=I18N[lang];

document.getElementById(
"tag"
).textContent=t.tag;

document.getElementById(
"title"
).innerHTML=t.title;

document.getElementById(
"hero"
).textContent=t.hero;

document.getElementById(
"notice"
).textContent=t.notice;

document.getElementById(
"search"
).placeholder=t.search;

document.getElementById(
"cartTitle"
).textContent=t.cart;

document.getElementById(
"sum"
).textContent=t.sum;

document.getElementById(
"orderBtn"
).textContent=t.order;

document.getElementById(
"accountBtn"
).textContent=
current
?
"👤 "+
current.email.split("@")[0]
:
t.account;

syncAuth();

render();

}

applyLang();

refreshUser();

</script>

</body>
</html>
