html{scroll-behavior:smooth}
body{
 margin:0;
 background:#060609;
 color:#f7f7fb;
 font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
 overflow-x:hidden
}

body:before{
 content:"";
 position:fixed;
 inset:-30%;
 z-index:-2;
 background:
 radial-gradient(circle at 20% 15%,#8b5cf633,transparent 25%),
 radial-gradient(circle at 80% 40%,#ff3cac22,transparent 24%),
 radial-gradient(circle at 50% 100%,#4f46e522,transparent 28%);
 filter:blur(35px);
 animation:bg 16s ease-in-out infinite alternate
}

@keyframes bg{
 to{transform:translate(3%,2%) scale(1.08) rotate(6deg)}
}

@keyframes rise{
 from{opacity:0;transform:translateY(24px)}
 to{opacity:1;transform:none}
}

.top{
 position:sticky;
 top:0;
 z-index:50;
 border-bottom:1px solid #ffffff12;
 background:#060609d9;
 backdrop-filter:blur(20px)
}

.nav{
 max-width:1450px;
 margin:auto;
 display:flex;
 gap:10px;
 align-items:center;
 padding:13px 20px
}

.brand{
 font-size:19px;
 font-weight:950;
 letter-spacing:-.8px;
 margin-right:auto
}

.brand span{color:#c4b5fd}

.btn,.select,.search{
 border:1px solid #ffffff16;
 background:#ffffff08;
 color:#fff;
 border-radius:12px
}

.btn{
 padding:10px 13px;
 cursor:pointer
}

.select{padding:10px}
.select option{background:#111}

.hero{
 max-width:1450px;
 margin:auto;
 padding:75px 20px 35px;
 animation:rise .7s
}

.pill{
 display:inline-flex;
 padding:8px 12px;
 border:1px solid #a78bfa44;
 background:#8b5cf612;
 border-radius:99px;
 color:#d8b4fe;
 font-size:11px;
 font-weight:800

h1{

 line-height:.9;
 letter-spacing:-6px;
 margin:18px 0 20px
}

.gradient{
 background:linear-gradient(100deg,#fff,#c4b5fd,#f0abfc);
 color:transparent;
 background-clip:text;
 -webkit-background-clip:text
}

.hero p{
 max-width:720px;
 color:#9b9ba7;
 line-height:1.7
}

.notice{
 max-width:1450px;
 margin:auto;
 padding:0 20px 22px

.notice>div{
 padding:14px 16px;
 border:1px solid #facc1533;
 background:#facc1509;
 border-radius:15px;
 color:#ddd;
 font-size:13px;
 line-height:1.6
}

.profile,.admin{
 max-width:1450px;
 margin:auto;
 padding:0 20px 20px;
 display:none
}

.panel{
 border:1px solid #ffffff13;
 background:#ffffff06;
 border-radius:18px;
 padding:15px

.profilegrid{

 align-items:center;
 flex-wrap:wrap
}

.xp{
 height:8px;
 min-width:180px;
 flex:1;
 background:#ffffff0c;
 border-radius:99px;
 overflow:hidden
}

.xp i{
 display:block;
 height:100%;
 width:0;
 background:linear-gradient(90deg,#8b5cf6,#f0abfc);
 transition:1s
}

.shop{
 max-width:1450px;
 margin:auto;
 padding:10px 20px 90px
}

.tools{
 display:flex;
 gap:10px;
 margin-bottom:18px
}

.search{
 flex:1;
 padding:14px;
 outline:0
}

.grid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:15px
}

.card{
 background:linear-gradient(145deg,#15151b,#09090c);
 border:1px solid #ffffff12;
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 20px 60px #0008;
 animation:rise .55s both;
 transition:.3s
}

.card:hover{
 transform:translateY(-7px);
 border-color:#a78bfa66;
 box-shadow:0 30px 80px #000b,0 0 30px #8b5cf622
}

.cover{
 aspect-ratio:2/3;
 background:#111;
 overflow:hidden;
 position:relative
}

.cover img{
 width:100%;
 height:100%;
 object-fit:cover;
 transition:.6s
}

.card:hover img{transform:scale(1.07)}

.cover:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(0deg,#000d,transparent 48%)
}

.info{padding:12px}

.name{
 font-size:13px;
 font-weight:800;
 line-height:1.4;
 min-height:38px
}

.bar{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
 margin-top:12px
}

.price{
 font-weight:950;
 font-size:18px
}

.old{
 text-decoration:line-through;
 color:#777;
 font-size:11px;
 margin-left:5px;
 font-weight:600
}

.add{

 border-radius:10px;
 padding:9px 11px;
 background:linear-gradient(135deg,#7c3aed,#d8b4fe);
 color:#fff;
 font-weight:900;
 cursor:pointer
}

.overlay{

 inset:0;
 z-index:100;
 background:#000b;
 backdrop-filter:blur(8px);
 opacity:0;
 pointer-events:none;
 transition:.25s
}

.overlay.open{
 opacity:1;
 pointer-events:auto
}

.drawer{
 position:absolute;
 right:0;
 top:0;
 width:min(480px,100%);
 height:100%;
 background:#0b0b0f;
 border-left:1px solid #ffffff16;
 padding:20px;

 flex-direction:column;
 animation:rise .3s
}

.items{
 flex:1;
 overflow:auto
}

.item{
 display:flex;
 gap:10px;
 padding:12px 0;
 border-bottom:1px solid #ffffff10
}

.item img{
 width:52px;
 height:72px;
 object-fit:cover;
 border-radius:8px
}

.grow{flex:1}

.grow b{
 font-size:12px;
 line-height:1.4
}

.qty{
 display:flex;
 gap:6px;
 align-items:center;
 margin-top:7px
}

.qty button,.remove{

 color:#fff;

 height:25px;

.remove{
 border:0;

.cartfoot{
 border-top:1px solid #ffffff14;
 padding-top:14px
}

.total{

 font-size:21px;
 font-weight:950;
 margin-bottom:12px
}

.wa{
 width:100%;
 padding:14px;
 border:0;
 border-radius:12px;
 background:#25d366;
 color:#06140b;
 font-weight:950;
 cursor:pointer

.modal{
 display:none;
 position:fixed;
 inset:0;
 z-index:200;
 place-items:center;
 padding:18px;
 background:#000d

.modal.show{display:grid}

.box{
 width:min(430px,100%);
 padding:22px;
 border-radius:20px;
 background:#0e0e13;
 border:1px solid #ffffff16;
 box-shadow:0 30px 100px #000

.field{
 width:100%;
 padding:12px;
 margin:6px 0;
 border-radius:10px;
 border:1px solid #ffffff14;
 background:#ffffff08;
 color:#fff;
 outline:0

.primary{
 width:100%;
 padding:12px;
 border:0;
 border-radius:10px;
 background:linear-gradient(135deg,#7c3aed,#d8b4fe);
 color:#fff;
 font-weight:900;
 cursor:pointer

.link{
 border:0;
 background:none;
 color:#c4b5fd;
 cursor:pointer;
 margin-top:9px

.orders{

 margin-top:12px

.order{

.confirm{

loading="lazy"

alt="${escapeHtml(g.name)}"
onerror="this.style.opacity=0"
>

</div>

<div class="info">

<div class="name">
${escapeHtml(g.name)}
</div>

<div class="bar">

<span class="price">
4 ₼
<span class="old">
${g.old} ₼
</span>
</span>

<button
class="add"
onclick="add(${g.id})"
>
${I18N[lang].add}
</button>

</div>

</div>

</article>

`).join("");

updateCart();

}


/* ============================================================
   HTML ESCAPE
   ============================================================ */

function escapeHtml(text){

return String(text)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* ============================================================
   CART
   ============================================================ */

function add(id){

const x=
cart.find(x=>x.id===id);

if(x)
x.qty++;
else
cart.push({
id,
qty:1
});

saveCart();
updateCart();

toast("🛒 Səbətə əlavə edildi");

}


function updateCart(){

const n=
cart.reduce(
(a,x)=>a+x.qty,
0
);

document.getElementById(
"cartCount"
).textContent=n;


document.getElementById(
"items"
).innerHTML=

cart.length

?

cart.map(x=>{

const g=
games.find(g=>g.id===x.id);

if(!g)return "";

return `

<div class="item">

<img src="${g.img}">

<div class="grow">

<b>
${escapeHtml(g.name)}
</b>

<div style="margin-top:4px">

<strong>
4 ₼
</strong>

× ${x.qty}

<s style="color:#777;font-size:11px">
${g.old} ₼
</s>

</div>

<div class="qty">

<button onclick="change(${g.id},-1)">
−
</button>

${x.qty}

<button onclick="change(${g.id},1)">
+
</button>

</div>

</div>

<button
class="remove"
onclick="removeItem(${g.id})"
>
×
</button>

</div>

`;

}).join("")

:

`<div class="empty">
Səbət boşdur 🎮
</div>`;


document.getElementById(
"total"
).textContent=
n*4+" ₼";

}


function change(id,d){

const x=
cart.find(x=>x.id===id);

if(!x)return;

x.qty+=d;

if(x.qty<=0){

removeItem(id);
return;

}

saveCart();
updateCart();

}


function removeItem(id){

cart=
cart.filter(
x=>x.id!==id
);

saveCart();
updateCart();

}


function openCart(){

document
.getElementById("cartOverlay")
.classList.add("open");

}


function closeCart(){

document
.getElementById("cartOverlay")
.classList.remove("open");

}


/* ============================================================
   AUTH
   ============================================================ */

function openAuth(){

document
.getElementById("auth")
.classList.add("show");

syncAuth();

}


function closeAuth(){

document
.getElementById("auth")
.classList.remove("show");

}


function toggleAuth(){

mode=
mode==="signup"
?"login"
:"signup";

syncAuth();

}


function syncAuth(){

const t=I18N[lang];

document.getElementById(
"authTitle"
).textContent=
mode==="signup"
?t.signup
:t.login;

document.getElementById(
"authSubmit"
).textContent=
mode==="signup"
?t.signup
:t.login;

document.getElementById(
"authToggle"
).textContent=
mode==="signup"
?"Artıq hesabım var"
:"Hesab yarat";

document.getElementById(
"username"
).style.display=
mode==="signup"
?"block"
:"none";

}


/* ============================================================
   SUPABASE AUTH
   ============================================================ */

async function authSubmit(){

const email=
document
.getElementById("email")
.value
.trim()
.toLowerCase();

const password=
document
.getElementById("pass")
.value;

const username=
document
.getElementById("username")
.value
.trim();


if(!email || password.length<8){

toast(
"⚠️ E-poçt və ən azı 8 simvolluq şifrə lazımdır"
);

return;

}


if(
mode==="signup" &&
!username
){

toast(
"⚠️ İstifadəçi adı yaz"
);

return;

}


try{

if(mode==="signup"){

const {data,error}=

await db.auth.signUp({

email,
password,

options:{
data:{
username
}
}

});


if(error)
throw error;


if(!data.session){

toast(
"📧 E-poçtuna təsdiq linki göndərildi"
);

return;

}

toast("✅ Hesab yaradıldı");

}else{

const {error}=

await db.auth.signInWithPassword({

email,
password

});

if(error)
throw error;

toast("👋 Xoş gəldin");

}


closeAuth();

await loadCurrentUser();

}catch(error){

console.error(error);

toast(
"❌ "+error.message
);

}

}


/* ============================================================
   CURRENT USER
   ============================================================ */

async function loadCurrentUser(){

const {
data:{
user
}
}=

await db.auth.getUser();

currentUser=user;

if(!user){

profile=null;
refreshUserUI();

return;

}


const {
data,
error
}=

await db
.from("profiles")
.select("*")
.eq("id",user.id)
.single();


if(error){

console.error(error);

toast(
"⚠️ Profil yüklənmədi"
);

return;

}


profile=data;

refreshUserUI();

if(isAdmin()){

showAdmin();

await loadAdminOrders();

subscribeAdmin();

}else{

document
.getElementById("admin")
.style.display="none";

}

}


/* ============================================================
   ADMIN
   ============================================================ */

function isAdmin(){

return !!currentUser &&
currentUser.email &&
currentUser.email.toLowerCase()
===ADMIN_EMAIL;

}


function refreshUserUI(){

const p=
document.getElementById("profile");

const a=
document.getElementById("admin");

if(!currentUser || !profile){

p.style.display="none";
a.style.display="none";

document.getElementById(
"accountBtn"
).textContent=
I18N[lang].account;

return;

}


p.style.display="block";

document.getElementById(
"userEmail"
).textContent=
profile.email||currentUser.email;


document.getElementById(
"userLevel"
).textContent=
"LV."+(
profile.level||1
);


const xp=
profile.xp||0;


document.getElementById(
"xpText"
).textContent=
`${xp} XP • 🎁 ${profile.gift_games||0}`;


document.getElementById(
"xpBar"
).style.width=
Math.min(
100,
xp%100
)+"%";


document.getElementById(
"logoutBtn"
).textContent=
I18N[lang].logout;


document.getElementById(
"accountBtn"
).textContent=
"👤 "+
(
profile.username||
currentUser.email.split("@")[0]
);


if(isAdmin())
showAdmin();
else
a.style.display="none";

}


function showAdmin(){

document
.getElementById("admin")
.style.display="block";

}


/* ============================================================
   CREATE ORDER
   ============================================================ */

async function order(){

if(!cart.length){

toast("Səbət boşdur");
return;

}


if(!currentUser){

toast(
"🔐 Sifariş üçün əvvəlcə hesaba daxil ol"
);

openAuth();

return;

}


const validItems=
cart
.map(x=>{

const g=
games.find(g=>g.id===x.id);

if(!g)return null;

return {
game:g,
qty:x.qty
};

})
.filter(Boolean);


if(!validItems.length){

toast("Səbətdə düzgün oyun yoxdur");
return;

}


const total=
validItems.reduce(
(sum,x)=>sum+x.qty*4,
0
);


try{

/*
   ORDER
*/

const {
data:orderRow,
error:orderError
}=

await db
.from("orders")
.insert({

user_id:currentUser.id,
total:total,
status:"pending"

})
.select()
.single();


if(orderError)
throw orderError;


/*
   ORDER ITEMS
*/

const items=
validItems.map(x=>({

order_id:orderRow.id,

game_id:x.game.id,

quantity:x.qty,

price:4

}));


const {
error:itemError
}=

await db
.from("order_items")
.insert(items);


if(itemError){

/*
   Item əlavə olunmadısa sifarişi sil
*/

await db
.from("orders")
.delete()
.eq("id",orderRow.id);

throw itemError;

}


/*
   WHATSAPP MESAJI
*/

let text=
"🎮 BakuShopAzerbaijan SİFARİŞİ\n\n";

validItems.forEach((x,i)=>{

text+=
`${i+1}. ${x.game.name}\n`+
`${x.qty} × 4 ₼\n\n`;

});

text+=
"💰 Cəmi: "+
total+
" ₼\n\n";

text+=
"🆔 Sifariş ID: "+
orderRow.id;


window.open(
"https://wa.me/"+WA+
"?text="+
encodeURIComponent(text),
"_blank"
);


/*
   SƏBƏTİ TƏMİZLƏ
*/

cart=[];

saveCart();
updateCart();
closeCart();

toast(
"✅ Sifariş yaradıldı və adminə göndərildi"
);

}catch(error){

console.error(error);

toast(
"❌ Sifariş xətası: "+
error.message
);

}

}


/* ============================================================
   ADMIN ORDERS
   ============================================================ */

async function loadAdminOrders(){

if(!isAdmin())
return;


const {
data,
error
}=

await db
.from("orders")
.select(`
    *,
    profiles:user_id(
        email,
        username
    ),
    order_items(
        game_id,
        quantity,
        price
    )
`)
.order("created_at",{ascending:false});


if(error){

console.error(error);

document.getElementById(
"orders"
).innerHTML=
`<div class="order">
❌ Sifarişlər yüklənmədi:<br>
${escapeHtml(error.message)}
</div>`;

return;

}


const pending=
data.filter(
x=>x.status==="pending"
).length;


document.getElementById(
"adminStats"
).textContent=
`👥 Sifariş: ${data.length} • ⏳ Gözləyən: ${pending}`;


if(!data.length){

document.getElementById(
"orders"
).innerHTML=
`<div class="empty">
Hələ sifariş yoxdur 📦
</div>`;

return;

}


document.getElementById(
"orders"
).innerHTML=

data.map(o=>{

const customer=
o.profiles?.email||
"Naməlum istifadəçi";


const items=
(o.order_items||[])
.map(x=>{

const g=
games.find(
g=>g.id===x.game_id
);

return `
${escapeHtml(
g?.name||
"Oyun #"+x.game_id
)}
 × ${x.quantity}
`;

})
.join("<br>");


const statusClass=
o.status==="pending"
?"pending"
:
o.status==="confirmed"
?"confirmed"
:"cancelled";


const buttons=

o.status==="pending"

?

`

<button
class="confirm"
onclick="confirmOrder('${o.id}')"
>
✓ Təsdiqlə və XP ver
</button>

<button
class="reject"
onclick="cancelOrder('${o.id}')"
>
✕ Ləğv et
</button>

`

:"";


return `

<div class="order">

<b>
📦 ${escapeHtml(customer)}
</b>

<br>

<small>
🆔 ${o.id}
</small>

<br>

<small>
💰 ${o.total||0} ₼
</small>

<br>

<small>
<span class="status ${statusClass}">
${escapeHtml(o.status)}
</span>
</small>

<div style="margin-top:9px;color:#bbb;font-size:12px">

${items}

</div>

${buttons}

</div>

`;

}).join("");

}


/* ============================================================
   CONFIRM ORDER
   ============================================================ */

async function confirmOrder(id){

if(!isAdmin()){

toast("⛔ Admin icazəsi yoxdur");
return;

}


const {
error
}=

await db
.from("orders")
.update({
status:"confirmed"
})
.eq("id",id)
.eq("status","pending");


if(error){

toast(
"❌ "+error.message
);

return;

}


toast(
"✅ Sifariş təsdiqləndi • XP server tərəfindən verildi"
);

await loadAdminOrders();

}


/* ============================================================
   CANCEL ORDER
   ============================================================ */

async function cancelOrder(id){

if(!isAdmin())
return;


const {
error
}=

await db
.from("orders")
.update({
status:"cancelled"
})
.eq("id",id)
.eq("status","pending");


if(error){

toast(
"❌ "+error.message
);

return;

}


toast("❌ Sifariş ləğv edildi");

await loadAdminOrders();

}


/* ============================================================
   ADMIN REALTIME
   ============================================================ */

function subscribeAdmin(){

if(!isAdmin())
return;


db
.channel("admin-orders-live")
.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"orders"
},
payload=>{

console.log(
"Yeni sifariş dəyişiklik:",
payload
);

loadAdminOrders();

}
)
.subscribe();

}


/* ============================================================
   LOGOUT
   ============================================================ */

async function logout(){

await db.auth.signOut();

currentUser=null;
profile=null;

refreshUserUI();

toast("👋 Çıxış edildi");

}


/* ============================================================
   LANGUAGE
   ============================================================ */

function setLang(l){

lang=l;

localStorage.setItem(
"bsa_lang_v6",
l
);

applyLang();

}


function applyLang(){

const t=I18N[lang];

document.getElementById(
"tag"
).textContent=t.tag;

document.getElementById(
"title"
).innerHTML=t.title;

document.getElementById(
"hero"
).textContent=t.hero;

document.getElementById(
"notice"
).textContent=t.notice;

document.getElementById(
"search"
).placeholder=t.search;

document.getElementById(
"cartTitle"
).textContent=t.cart;

document.getElementById(
"sum"
).textContent=t.sum;

document.getElementById(
"orderBtn"
).textContent=t.order;

document.getElementById(
"lang"
).value=lang;

syncAuth();

render();

refreshUserUI();

}


/* ============================================================
   AUTH STATE CHANGES
   ============================================================ */

db.auth.onAuthStateChange(
async(event,session)=>{

console.log(
"Auth:",
event
);

if(session){

currentUser=session.user;

}else{

currentUser=null;
profile=null;

}

refreshUserUI();

}
);


/* ============================================================
   START
   ============================================================ */

async function start(){

applyLang();

updateCart();

const {
data:{
session
}
}=

await db.auth.getSession();


if(session){

currentUser=session.user;

await loadCurrentUser();

}else{

refreshUserUI();

}

}


start();

</script>
